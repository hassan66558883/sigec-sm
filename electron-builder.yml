appId: td.ndjamena.sigecsm
productName: SIGEC-SM
copyright: "Copyright (C) 2026 Mairie de la Ville de N'Djamena"

directories:
  output: release
  buildResources: build

# Le code de l'app SIGEC-SM elle-meme n'est PAS embarque ici via `files` :
# il est copie tel quel (sortie `next build` avec output:"standalone", voir
# next.config.mjs) via extraResources ci-dessous. `files` ne contient que le
# shell Electron (electron/) qui l'orchestre.
files:
  - electron/**/*
  - package.json

extraResources:
  # electron-builder applique un motif `!**/node_modules/**` global a TOUTE
  # copie de fichiers (visible dans release/builder-debug.yml), meme avec un
  # `filter` explicite sur cette entree — le node_modules autonome de
  # `next build output:"standalone"` ne peut donc PAS etre inclus via
  # extraResources. Copie a la place par electron/after-pack.js (hook
  # `afterPack`, en dehors du systeme de filtrage). Sans ce contournement le
  # serveur empaquete ne demarre jamais ("Cannot find module 'next'"). Bug
  # constate et corrige le 2026-09-02.
  - from: .next/standalone
    to: standalone
    filter:
      - "**/*"
      # Next.js copie automatiquement le .env du poste de build dans la
      # sortie standalone — sans cette exclusion, les secrets du poste de
      # build (DATABASE_URL, SESSION_SECRET, ENCRYPTION_KEY...) finiraient
      # en clair dans l'installateur livre. electron/server-runner.js passe
      # deja ses propres valeurs via `env:` au sous-processus ; ce fichier
      # n'est donc jamais necessaire au runtime.
      - "!.env"
  - from: .next/static
    to: standalone/.next/static
  # Ajouter ici `public` si le dossier est cree un jour (actuellement vide,
  # voir next.config.mjs — Next.js n'exige pas sa presence).

afterPack: electron/after-pack.js

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SIGEC-SM
  artifactName: "SIGEC-SM-Setup-${version}.${ext}"

asar: true
